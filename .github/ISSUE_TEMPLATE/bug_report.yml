name: Bug report
description: Report reproducible observer behavior.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include transcripts, credentials, tokens, local paths, or raw tool output."
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Safe reproduction steps
    validations:
      required: true
  - type: input
    id: extension-version
    attributes:
      label: Extension version
      placeholder: "0.1.82"
    validations:
      required: true
